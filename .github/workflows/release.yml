# Builds the self-contained x86-64 bundle (wavelink-linux/packaging/release.Dockerfile). A pushed v* tag
# publishes it as a GitHub release; a manual run only uploads it as a workflow artifact.
# The bundle holds no Elgato files: users import those from their own installer with install.sh.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build bundle
        run: |
          docker buildx build --platform linux/amd64 -f wavelink-linux/packaging/release.Dockerfile \
            --target export --output type=local,dest=dist .
          cd dist && sha256sum wavelink-linux-x86_64.tar.gz > wavelink-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: wavelink-linux-x86_64
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/wavelink-linux-x86_64.tar.gz \
            dist/wavelink-linux-x86_64.tar.gz.sha256 --title "$GITHUB_REF_NAME" --generate-notes
