# Builds the self-contained x86-64 bundle (wavelink-linux/packaging/release.Dockerfile). A pushed v* tag
# (including one created by publishing a release on github.com) attaches it to that release; a manual
# run only uploads it as a workflow artifact.
# The bundle holds no Elgato files: users import those from their own installer with install.sh.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build bundle
        run: |
          docker buildx build --platform linux/amd64 -f wavelink-linux/packaging/release.Dockerfile \
            --target export --output type=local,dest=dist .
          cd dist && sha256sum wavelink-linux-x86_64.tar.gz > wavelink-linux-x86_64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: wavelink-linux-x86_64
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # A release drafted on github.com already exists when its tag starts this run; attach to it.
        run: |
          files="dist/wavelink-linux-x86_64.tar.gz dist/wavelink-linux-x86_64.tar.gz.sha256"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --title "$GITHUB_REF_NAME" --generate-notes
          fi
